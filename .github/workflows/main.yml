
name: Deploy sedaye-smart to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Inspect installed WASM and framework packages
        run: |
          echo "===== Installed package versions ====="
          npm ls @cf-wasm/satori @cf-wasm/resvg @opennextjs/cloudflare next --depth=3 || true
          echo "===== Package resolution ====="
          node -e "for (const p of ['@cf-wasm/satori','@cf-wasm/resvg','@opennextjs/cloudflare','next']) { try { console.log(p + ': ' + require(p + '/package.json').version) } catch (e) { console.log(p + ': version lookup unavailable - ' + e.message) } }"

      - name: Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
