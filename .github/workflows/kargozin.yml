
name: Check Kargozin Telegram channel

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check channel and forward new text posts
        run: curl --fail --silent --show-error --max-time 45 'https://sedaye-smart.mehdimontakhab6.workers.dev/api/news/kargozin'
