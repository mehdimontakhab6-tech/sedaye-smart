
name: Check Kargozin Telegram channel

'on':
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check channel and forward new text posts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 45 \
            'https://sedaye-smart.mehdimontakhab6.workers.dev/api/news/kargozin'
          echo "HTTP request completed successfully."
