
name: Check Kargozin Telegram channel

'on':
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check channel and forward new text posts
        shell: bash
        run: 'curl --fail --silent --show-error --max-time 45 --write-out "HTTP Status: %{http_code}\n" "https://sedaye-smart.mehdimontakhab6.workers.dev/api/news/kargozin"'
